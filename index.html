<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FiveM クラフト計算機</title>
  <style>
    :root {
      --bg-color: #1a1c23;
      --card-bg: #232631;
      --sub-card-bg: #2a2d3d;
      --text-color: #e2e8f0;
      --accent-orange: #ed8936;
      --accent-blue: #63b3ed;
      --border-color: #3f4457;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .toolbar {
      background-color: var(--card-bg);
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
    }

    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
    }
    .btn-green { background-color: #38a169; }
    .btn-green:hover { background-color: #2f855a; }
    .btn-gray { background-color: #4a5568; }
    .btn-gray:hover { background-color: #374151; }
    .btn-blue { background-color: #3182ce; }
    .btn-blue:hover { background-color: #2b6cb0; }
    .btn-red { background-color: #e53e3e; }

    .calculator-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      border: 1px solid var(--border-color);
    }

    .card h2 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--accent-orange);
      padding-bottom: 8px;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: #fff;
      box-sizing: border-box;
      font-size: 14px;
    }

    .parts-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .part-box {
      background-color: var(--sub-card-bg);
      padding: 12px;
      border-radius: 6px;
    }

    .part-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: bold;
      color: var(--accent-orange);
    }
    .checkbox-label input { width: auto; cursor: pointer; }

    .qty-input-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .qty-input-wrapper input {
      width: 60px;
      padding: 4px 6px;
      text-align: center;
    }

    .mat-list {
      margin: 8px 0 0 0;
      padding-left: 20px;
      font-size: 13px;
      color: #cbd5e0;
    }

    .labor-tag { color: var(--accent-blue); font-weight: bold; }

    .total-box {
      background-color: var(--bg-color);
      padding: 14px;
      border-radius: 6px;
      border-left: 4px solid var(--accent-orange);
    }

    .total-box h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: var(--accent-orange);
    }

    .total-box ul { margin: 0; padding-left: 20px; font-size: 14px; }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 550px;
      max-height: 85vh;
      overflow-y: auto;
      border: 1px solid var(--border-color);
    }

    .edit-section {
      background: var(--sub-card-bg);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .mat-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }

    .attach-select-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 150px;
      overflow-y: auto;
      background: var(--bg-color);
      padding: 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button id="edit-recipe-btn" class="btn btn-green">📝 レシピを編集・追加する</button>
    <button id="export-btn" class="btn btn-gray">💾 データを書き出す</button>
    <input type="file" id="import-file" accept=".json" style="display: none;" />
    <button id="import-btn" class="btn btn-gray">📂 データを読み込む</button>
  </div>

  <div class="calculator-grid">

    <!-- 1. 武器クラフト -->
    <div class="card">
      <h2>[9023]武器クラフト【武器・防具】</h2>
      <div class="form-group">
        <label for="weapon-select">作成する武器・防具</label>
        <select id="weapon-select"></select>
      </div>
      <div class="parts-container" id="weapon-parts"></div>
      <div class="total-box">
        <h3>📦 必要な全素材の合計数</h3>
        <ul id="weapon-totals"></ul>
      </div>
    </div>

    <!-- 2. 手芸クラフト -->
    <div class="card">
      <h2>[3057]手芸クラフト【犯罪道具】</h2>
      <div class="form-group">
        <label for="crime-select">ターゲットの犯罪</label>
        <select id="crime-select"></select>
      </div>
      <div class="parts-container" id="crime-parts"></div>
      <div class="total-box">
        <h3>📦 必要な全素材の合計数</h3>
        <ul id="crime-totals"></ul>
      </div>
    </div>

  </div>

  <!-- レシピ編集モーダル -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-content">
      <h2>📝 レシピ・アタッチメントの編集</h2>
      
      <div class="form-group">
        <label>編集モードを選択</label>
        <select id="edit-mode-select">
          <option value="item">アイテム本体の編集（銃・道具など）</option>
          <option value="attachment">パーツ/アタッチメント単体の編集</option>
        </select>
      </div>

      <!-- モード1: アイテム編集 -->
      <div id="mode-item-container">
        <div class="form-group">
          <label>カテゴリ</label>
          <select id="edit-category-select">
            <option value="weapon">武器クラフト</option>
            <option value="crime">手芸クラフト</option>
          </select>
        </div>

        <div class="form-group">
          <label>編集するアイテム</label>
          <select id="edit-item-select"></select>
        </div>

        <div id="item-form-area" class="edit-section">
          <div class="form-group">
            <label>アイテム名</label>
            <input type="text" id="edit-item-name" placeholder="例: APピストル">
          </div>

          <div class="form-group">
            <label>本体の労働力 (pt)</label>
            <input type="number" id="edit-item-labor" value="10" min="0">
          </div>

          <label>本体の必要素材:</label>
          <div id="item-mats-container"></div>
          <button class="btn btn-gray" id="add-item-mat-btn" style="font-size: 11px; padding: 2px 6px; margin: 4px 0 12px 0;">＋ 素材枠追加</button>

          <label>付属させるアタッチメント/パーツ（選択式）:</label>
          <div class="attach-select-list" id="attach-checkbox-list"></div>
        </div>
      </div>

      <!-- モード2: アタッチメント単体編集 -->
      <div id="mode-attach-container" style="display: none;">
        <div class="form-group">
          <label>編集するアタッチメント/パーツ</label>
          <select id="edit-attach-select"></select>
        </div>

        <div id="attach-form-area" class="edit-section">
          <div class="form-group">
            <label>アタッチメント名</label>
            <input type="text" id="edit-attach-name" placeholder="例: 大容量マガジン">
          </div>
          <div class="form-group">
            <label>労働力 (pt)</label>
            <input type="number" id="edit-attach-labor" value="5" min="0">
          </div>
          <label>必要素材:</label>
          <div id="attach-mats-container"></div>
          <button class="btn btn-gray" id="add-attach-mat-btn" style="font-size: 11px; padding: 2px 6px; margin-top: 4px;">＋ 素材枠追加</button>
        </div>
      </div>

      <div class="modal-actions">
        <button id="close-modal-btn" class="btn btn-gray">キャンセル</button>
        <button id="save-modal-btn" class="btn btn-blue">保存して反映</button>
      </div>
    </div>
  </div>

  <script>
    // マスターデータ構造のアップデート（アタッチメント独立化）
    let recipeData = {
      attachments: {
        suppressor: { name: "🔹 サプレッサー", labor: 5, materials: { "高品質な鉄": 4 } },
        ammo_9mm: { name: "🔹 9mm弾", labor: 2, materials: { "ガンパウダー": 2 } },
        hacking_pc: { name: "🔹 ハッキングPC", labor: 20, materials: { "精密部品": 10, "電子部品": 15 } },
        thermite: { name: "🔹 サーマイト爆薬", labor: 10, materials: { "マグネシウム": 5 } }
      },
      weapon: {
        heavy_pistol: {
          name: "ヘビーピストル",
          labor: 10,
          materials: { "高品質な鉄": 10, "スプリング": 3 },
          attachmentIds: ["suppressor", "ammo_9mm"]
        },
        armor: {
          name: "防弾チョッキ",
          labor: 15,
          materials: { "プラスチック": 8, "布": 12 },
          attachmentIds: []
        }
      },
      crime: {
        pacific: {
          name: "パシフィック銀行強盗",
          labor: 0,
          materials: {},
          attachmentIds: ["hacking_pc", "thermite"]
        }
      }
    };

    const saved = localStorage.getItem('craft_recipes_data_v2');
    if (saved) {
      try { recipeData = JSON.parse(saved); } catch(e) {}
    }

    class CraftCalculator {
      constructor(type, categoryData, selectEl, partsEl, totalsEl) {
        this.type = type;
        this.categoryData = categoryData;
        this.selectEl = selectEl;
        this.partsEl = partsEl;
        this.totalsEl = totalsEl;

        this.updateSelectOptions();
        this.selectEl.addEventListener('change', () => this.render());
        this.render();
      }

      updateSelectOptions() {
        this.selectEl.innerHTML = '';
        for (const [key, item] of Object.entries(this.categoryData)) {
          const opt = document.createElement('option');
          opt.value = key;
          opt.textContent = item.name;
          this.selectEl.appendChild(opt);
        }
      }

      render() {
        const itemKey = this.selectEl.value;
        const item = this.categoryData[itemKey];
        this.partsEl.innerHTML = '';

        if (!item) return;

        // 本体の表示（素材がある場合のみ）
        if (Object.keys(item.materials).length > 0 || item.labor > 0) {
          const baseBox = document.createElement('div');
          baseBox.className = 'part-box';
          let matListHTML = `<ul class="mat-list"><li><span class="labor-tag">労働力</span>: ${item.labor} pt</li>`;
          for (const [mat, qty] of Object.entries(item.materials)) {
            matListHTML += `<li>${mat}: ${qty} 個</li>`;
          }
          matListHTML += '</ul>';
          baseBox.innerHTML = `
            <div class="part-header">
              <strong>🔹 本体 (${item.name})</strong>
              <div class="qty-input-wrapper">
                <span>数量:</span>
                <input type="number" class="base-qty-input" value="1" min="1">
              </div>
            </div>
            ${matListHTML}
          `;
          this.partsEl.appendChild(baseBox);
        }

        // 関連アタッチメントの表示
        (item.attachmentIds || []).forEach(attId => {
          const att = recipeData.attachments[attId];
          if (!att) return;

          const box = document.createElement('div');
          box.className = 'part-box';
          let matListHTML = `<ul class="mat-list"><li><span class="labor-tag">労働力</span>: ${att.labor} pt</li>`;
          for (const [mat, qty] of Object.entries(att.materials)) {
            matListHTML += `<li>${mat}: ${qty} 個</li>`;
          }
          matListHTML += '</ul>';

          box.innerHTML = `
            <div class="part-header">
              <label class="checkbox-label">
                <input type="checkbox" class="att-checkbox" data-att-id="${attId}" checked>
                ${att.name}
              </label>
              <div class="qty-input-wrapper">
                <span>数量:</span>
                <input type="number" class="att-qty-input" data-att-id="${attId}" value="1" min="1">
              </div>
            </div>
            ${matListHTML}
          `;
          this.partsEl.appendChild(box);
        });

        this.partsEl.querySelectorAll('input').forEach(el => {
          el.addEventListener('input', () => this.calculate());
          el.addEventListener('change', () => this.calculate());
        });

        this.calculate();
      }

      calculate() {
        const itemKey = this.selectEl.value;
        const item = this.categoryData[itemKey];
        let totalLabor = 0;
        const totalMaterials = {};

        if (!item) return;

        // 本体の計算
        const baseQtyInput = this.partsEl.querySelector('.base-qty-input');
        if (baseQtyInput) {
          const baseQty = Math.max(1, parseInt(baseQtyInput.value) || 1);
          totalLabor += item.labor * baseQty;
          for (const [mat, qty] of Object.entries(item.materials)) {
            totalMaterials[mat] = (totalMaterials[mat] || 0) + qty * baseQty;
          }
        }

        // アタッチメントの計算
        (item.attachmentIds || []).forEach(attId => {
          const cb = this.partsEl.querySelector(`.att-checkbox[data-att-id="${attId}"]`);
          if (cb && cb.checked) {
            const qtyInput = this.partsEl.querySelector(`.att-qty-input[data-att-id="${attId}"]`);
            const attQty = Math.max(1, parseInt(qtyInput ? qtyInput.value : 1) || 1);
            const att = recipeData.attachments[attId];

            totalLabor += att.labor * attQty;
            for (const [mat, qty] of Object.entries(att.materials)) {
              totalMaterials[mat] = (totalMaterials[mat] || 0) + qty * attQty;
            }
          }
        });

        this.totalsEl.innerHTML = `<li><span class="labor-tag">労働力</span>: <strong>${totalLabor} pt</strong></li>`;
        for (const [mat, qty] of Object.entries(totalMaterials)) {
          this.totalsEl.innerHTML += `<li>${mat}: <strong>${qty} 個</strong></li>`;
        }
      }
    }

    const weaponCalc = new CraftCalculator('weapon', recipeData.weapon, document.getElementById('weapon-select'), document.getElementById('weapon-parts'), document.getElementById('weapon-totals'));
    const crimeCalc = new CraftCalculator('crime', recipeData.crime, document.getElementById('crime-select'), document.getElementById('crime-parts'), document.getElementById('crime-totals'));

    // モーダル編集ロジック
    const modal = document.getElementById('edit-modal');
    const modeSelect = document.getElementById('edit-mode-select');
    const modeItemCont = document.getElementById('mode-item-container');
    const modeAttachCont = document.getElementById('mode-attach-container');

    const editCatSelect = document.getElementById('edit-category-select');
    const editItemSelect = document.getElementById('edit-item-select');
    const editItemName = document.getElementById('edit-item-name');
    const editItemLabor = document.getElementById('edit-item-labor');
    const itemMatsContainer = document.getElementById('item-mats-container');
    const attachCheckboxList = document.getElementById('attach-checkbox-list');

    const editAttachSelect = document.getElementById('edit-attach-select');
    const editAttachName = document.getElementById('edit-attach-name');
    const editAttachLabor = document.getElementById('edit-attach-labor');
    const attachMatsContainer = document.getElementById('attach-mats-container');

    modeSelect.addEventListener('change', () => {
      if (modeSelect.value === 'item') {
        modeItemCont.style.display = 'block';
        modeAttachCont.style.display = 'none';
        updateItemSelectOptions();
      } else {
        modeItemCont.style.display = 'none';
        modeAttachCont.style.display = 'block';
        updateAttachSelectOptions();
      }
    });

    // --- アイテム編集フォーム制御 ---
    function updateItemSelectOptions() {
      editItemSelect.innerHTML = '<option value="__new__">【＋ 新規アイテムを追加】</option>';
      const cat = editCatSelect.value;
      for (const [key, item] of Object.entries(recipeData[cat])) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = item.name;
        editItemSelect.appendChild(opt);
      }
      renderItemForm();
    }

    function renderItemForm() {
      const cat = editCatSelect.value;
      const key = editItemSelect.value;
      itemMatsContainer.innerHTML = '';
      attachCheckboxList.innerHTML = '';

      let item = { name: '', labor: 0, materials: {}, attachmentIds: [] };
      if (key !== '__new__' && recipeData[cat][key]) {
        item = recipeData[cat][key];
      }

      editItemName.value = item.name;
      editItemLabor.value = item.labor;

      // 素材描画
      for (const [mat, qty] of Object.entries(item.materials)) {
        addMatRow(itemMatsContainer, mat, qty);
      }

      // アタッチメント選択チェックボックス群描画
      for (const [attId, att] of Object.entries(recipeData.attachments)) {
        const isChecked = (item.attachmentIds || []).includes(attId) ? 'checked' : '';
        const label = document.createElement('label');
        label.className = 'checkbox-label';
        label.style.fontSize = '13px';
        label.innerHTML = `<input type="checkbox" class="edit-item-att-cb" value="${attId}" ${isChecked}> ${att.name}`;
        attachCheckboxList.appendChild(label);
      }
    }

    // --- アタッチメント編集フォーム制御 ---
    function updateAttachSelectOptions() {
      editAttachSelect.innerHTML = '<option value="__new__">【＋ 新規アタッチメントを追加】</option>';
      for (const [key, att] of Object.entries(recipeData.attachments)) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = att.name;
        editAttachSelect.appendChild(opt);
      }
      renderAttachForm();
    }

    function renderAttachForm() {
      const key = editAttachSelect.value;
      attachMatsContainer.innerHTML = '';

      let att = { name: '', labor: 0, materials: {} };
      if (key !== '__new__' && recipeData.attachments[key]) {
        att = recipeData.attachments[key];
      }

      editAttachName.value = att.name;
      editAttachLabor.value = att.labor;

      for (const [mat, qty] of Object.entries(att.materials)) {
        addMatRow(attachMatsContainer, mat, qty);
      }
    }

    function addMatRow(container, name = '', qty = 1) {
      const row = document.createElement('div');
      row.className = 'mat-input-row';
      row.innerHTML = `
        <input type="text" class="edit-mat-name" value="${name}" placeholder="素材名">
        <input type="number" class="edit-mat-qty" value="${qty}" min="1" style="width: 80px;">
        <button class="btn btn-red" style="padding: 2px 6px; font-size: 11px;">×</button>
      `;
      row.querySelector('button').addEventListener('click', () => row.remove());
      container.appendChild(row);
    }

    document.getElementById('add-item-mat-btn').addEventListener('click', () => addMatRow(itemMatsContainer));
    document.getElementById('add-attach-mat-btn').addEventListener('click', () => addMatRow(attachMatsContainer));

    editCatSelect.addEventListener('change', updateItemSelectOptions);
    editItemSelect.addEventListener('change', renderItemForm);
    editAttachSelect.addEventListener('change', renderAttachForm);

    document.getElementById('edit-recipe-btn').addEventListener('click', () => {
      updateItemSelectOptions();
      modal.classList.add('active');
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.remove('active'));

    // 保存ボタン処理
    document.getElementById('save-modal-btn').addEventListener('click', () => {
      if (modeSelect.value === 'item') {
        const cat = editCatSelect.value;
        let key = editItemSelect.value;
        const name = editItemName.value.trim();
        if (!name) return alert('アイテム名を入力してください。');

        if (key === '__new__') key = `item_${Date.now()}`;

        const materials = {};
        itemMatsContainer.querySelectorAll('.mat-input-row').forEach(row => {
          const mName = row.querySelector('.edit-mat-name').value.trim();
          const mQty = parseInt(row.querySelector('.edit-mat-qty').value) || 0;
          if (mName && mQty > 0) materials[mName] = mQty;
        });

        const attachmentIds = [];
        attachCheckboxList.querySelectorAll('.edit-item-att-cb:checked').forEach(cb => {
          attachmentIds.push(cb.value);
        });

        recipeData[cat][key] = {
          name: name,
          labor: parseInt(editItemLabor.value) || 0,
          materials: materials,
          attachmentIds: attachmentIds
        };

      } else { // アタッチメント保存
        let key = editAttachSelect.value;
        const name = editAttachName.value.trim();
        if (!name) return alert('アタッチメント名を入力してください。');

        if (key === '__new__') key = `att_${Date.now()}`;

        const materials = {};
        attachMatsContainer.querySelectorAll('.mat-input-row').forEach(row => {
          const mName = row.querySelector('.edit-mat-name').value.trim();
          const mQty = parseInt(row.querySelector('.edit-mat-qty').value) || 0;
          if (mName && mQty > 0) materials[mName] = mQty;
        });

        recipeData.attachments[key] = {
          name: name,
          labor: parseInt(editAttachLabor.value) || 0,
          materials: materials
        };
      }

      localStorage.setItem('craft_recipes_data_v2', JSON.stringify(recipeData));
      weaponCalc.updateSelectOptions();
      crimeCalc.updateSelectOptions();
      weaponCalc.render();
      crimeCalc.render();
      modal.classList.remove('active');
      alert('保存が完了しました！');
    });

    // データ入出力
    document.getElementById('export-btn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(recipeData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fivem_craft_recipes_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    const fileInput = document.getElementById('import-file');
    document.getElementById('import-btn').addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.weapon && imported.crime && imported.attachments) {
            recipeData = imported;
            localStorage.setItem('craft_recipes_data_v2', JSON.stringify(recipeData));
            weaponCalc.categoryData = recipeData.weapon;
            crimeCalc.categoryData = recipeData.crime;
            weaponCalc.updateSelectOptions();
            crimeCalc.updateSelectOptions();
            weaponCalc.render();
            crimeCalc.render();
            alert('データの読み込みが完了しました！');
          } else { alert('形式が正しくありません。'); }
        } catch (err) { alert('読み込みに失敗しました。'); }
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
