<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiveM クラフト計算機</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #334155;
      --red: #ef4444;
      --green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
    }

    .container { max-width: 1000px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .header-btns { display: flex; gap: 8px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 20px;
    }
    @media (max-width: 500px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-title {
      font-size: 1.2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      color: var(--accent);
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-red { background: var(--red); }
    .btn-green { background: var(--green); }

    .part-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .part-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .qty-input-wrapper { display: flex; align-items: center; gap: 6px; width: auto; }
    .qty-input-wrapper input { width: 60px; text-align: center; }

    .mat-list { list-style: none; padding-left: 8px; font-size: 0.9rem; color: var(--text-dim); }
    .mat-list li { margin-bottom: 2px; }

    .total-box {
      background: #0f172a;
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 12px;
      margin-top: auto;
    }
    .total-title { font-weight: bold; margin-bottom: 6px; color: var(--accent); }

    /* モーダル */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 90%; max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

    .mat-input-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    .checkbox-group { display: flex; flex-direction: column; gap: 4px; max-height: 100px; overflow-y: auto; background: #0f172a; padding: 6px; border-radius: 4px; }
    .checkbox-label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .labor-tag { color: #f59e0b; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>FiveM クラフト計算機</h1>
      <div class="header-btns">
        <button id="edit-recipe-btn" class="btn">🛠 レシピ編集</button>
        <button id="export-btn" class="btn btn-green">📤 エクスポート</button>
        <button id="import-btn" class="btn">📥 インポート</button>
        <input type="file" id="import-file" accept=".json" style="display: none;">
      </div>
    </header>

    <div class="grid">
      <!-- 武器・アイテム計算機 -->
      <div class="card">
        <h2 class="card-title">🔫 武器・作成物</h2>
        <select id="weapon-select"></select>
        <div id="weapon-parts"></div>
        <div class="total-box">
          <div class="total-title">必要合計素材</div>
          <ul id="weapon-totals" class="mat-list"></ul>
        </div>
      </div>

      <!-- 強盗・犯罪ツール計算機 -->
      <div class="card">
        <h2 class="card-title">💰 強盗・犯罪ツール</h2>
        <select id="crime-select"></select>
        <div id="crime-parts"></div>
        <div class="total-box">
          <div class="total-title">必要合計素材</div>
          <ul id="crime-totals" class="mat-list"></ul>
        </div>
      </div>
    </div>
  </div>

  <!-- レシピ編集モーダル -->
  <div id="edit-modal" class="modal">
    <div class="modal-content">
      <h2>レシピの編集</h2>

      <label>編集モード
        <select id="edit-mode-select">
          <option value="item">アイテム本体の編集</option>
          <option value="attach">アタッチメント・ツールの編集</option>
        </select>
      </label>

      <!-- アイテム編集フォーム -->
      <div id="mode-item-container">
        <label>カテゴリ
          <select id="edit-category-select">
            <option value="weapon">武器・作成物</option>
            <option value="crime">強盗・犯罪</option>
          </select>
        </label>

        <label style="margin-top: 8px; display: block;">対象アイテム
          <select id="edit-item-select"></select>
        </label>

        <label style="margin-top: 8px; display: block;">アイテム名
          <input type="text" id="edit-item-name">
        </label>

        <label style="margin-top: 8px; display: block;">必要労働力 (pt)
          <input type="number" id="edit-item-labor" min="0">
        </label>

        <div style="margin-top: 8px;">
          <label>必要素材</label>
          <div id="item-mats-container"></div>
          <button id="add-item-mat-btn" class="btn" style="padding: 2px 8px; font-size: 12px; margin-top: 4px;">＋ 素材を追加</button>
        </div>

        <div style="margin-top: 8px;">
          <label>関連付けアタッチメント</label>
          <div id="attach-checkbox-list" class="checkbox-group"></div>
        </div>
      </div>

      <!-- アタッチメント編集フォーム -->
      <div id="mode-attach-container" style="display: none;">
        <label>対象アタッチメント
          <select id="edit-attach-select"></select>
        </label>

        <label style="margin-top: 8px; display: block;">アタッチメント名
          <input type="text" id="edit-attach-name">
        </label>

        <label style="margin-top: 8px; display: block;">必要労働力 (pt)
          <input type="number" id="edit-attach-labor" min="0">
        </label>

        <div style="margin-top: 8px;">
          <label>必要素材</label>
          <div id="attach-mats-container"></div>
          <button id="add-attach-mat-btn" class="btn" style="padding: 2px 8px; font-size: 12px; margin-top: 4px;">＋ 素材を追加</button>
        </div>
      </div>

      <div class="modal-footer">
        <button id="close-modal-btn" class="btn btn-red">キャンセル</button>
        <button id="save-modal-btn" class="btn btn-green">保存する</button>
      </div>
    </div>
  </div>

  <script>
    // マスターデータ構造
    let recipeData = {
      attachments: {
        suppressor: { name: "🔹 サプレッサー", labor: 5, materials: { "高品質な鉄": 4 } },
        ammo_9mm: { name: "🔹 9mm弾", labor: 2, materials: { "ガンパウダー": 2 } },
        hacking_pc: { name: "🔹 ハッキングPC", labor: 20, materials: { "精密部品": 10, "電子部品": 15 } },
        thermite: { name: "🔹 サーマイト爆薬", labor: 10, materials: { "マグネシウム": 5 } }
      },
      weapon: {
        heavy_pistol: {
          name: "ヘビーピストル",
          labor: 10,
          materials: { "高品質な鉄": 10, "スプリング": 3 },
          attachmentIds: ["suppressor", "ammo_9mm"]
        },
        armor: {
          name: "防弾チョッキ",
          labor: 15,
          materials: { "プラスチック": 8, "布": 12 },
          attachmentIds: []
        }
      },
      crime: {
        pacific: {
          name: "パシフィック銀行強盗",
          labor: 0,
          materials: {},
          attachmentIds: ["hacking_pc", "thermite"]
        }
      }
    };

    const saved = localStorage.getItem('craft_recipes_data_v2');
    if (saved) {
      try { recipeData = JSON.parse(saved); } catch(e) {}
    }

    class CraftCalculator {
      constructor(type, categoryKey, selectEl, partsEl, totalsEl) {
        this.type = type;
        this.categoryKey = categoryKey;
        this.selectEl = selectEl;
        this.partsEl = partsEl;
        this.totalsEl = totalsEl;

        this.updateSelectOptions();
        this.selectEl.addEventListener('change', () => this.render());
        this.render();
      }

      updateSelectOptions(keepValue = true) {
        const currentVal = this.selectEl.value;
        this.selectEl.innerHTML = '';
        const categoryData = recipeData[this.categoryKey] || {};

        for (const [key, item] of Object.entries(categoryData)) {
          const opt = document.createElement('option');
          opt.value = key;
          opt.textContent = item.name;
          this.selectEl.appendChild(opt);
        }

        if (keepValue && categoryData[currentVal]) {
          this.selectEl.value = currentVal;
        }
      }

      render() {
        const itemKey = this.selectEl.value;
        const categoryData = recipeData[this.categoryKey] || {};
        const item = categoryData[itemKey];
        this.partsEl.innerHTML = '';

        if (!item) {
          this.totalsEl.innerHTML = '';
          return;
        }

        if (Object.keys(item.materials || {}).length > 0 || item.labor > 0) {
          const baseBox = document.createElement('div');
          baseBox.className = 'part-box';
          let matListHTML = `<ul class="mat-list"><li><span class="labor-tag">労働力</span>: ${item.labor} pt</li>`;
          for (const [mat, qty] of Object.entries(item.materials || {})) {
            matListHTML += `<li>${mat}: ${qty} 個</li>`;
          }
          matListHTML += '</ul>';
          baseBox.innerHTML = `
            <div class="part-header">
              <strong>🔹 本体 (${item.name})</strong>
              <div class="qty-input-wrapper">
                <span>数量:</span>
                <input type="number" class="base-qty-input" value="1" min="1">
              </div>
            </div>
            ${matListHTML}
          `;
          this.partsEl.appendChild(baseBox);
        }

        (item.attachmentIds || []).forEach(attId => {
          const att = recipeData.attachments[attId];
          if (!att) return;

          const box = document.createElement('div');
          box.className = 'part-box';
          let matListHTML = `<ul class="mat-list"><li><span class="labor-tag">労働力</span>: ${att.labor} pt</li>`;
          for (const [mat, qty] of Object.entries(att.materials || {})) {
            matListHTML += `<li>${mat}: ${qty} 個</li>`;
          }
          matListHTML += '</ul>';

          box.innerHTML = `
            <div class="part-header">
              <label class="checkbox-label">
                <input type="checkbox" class="att-checkbox" data-att-id="${attId}" checked>
                ${att.name}
              </label>
              <div class="qty-input-wrapper">
                <span>数量:</span>
                <input type="number" class="att-qty-input" data-att-id="${attId}" value="1" min="1">
              </div>
            </div>
            ${matListHTML}
          `;
          this.partsEl.appendChild(box);
        });

        this.partsEl.querySelectorAll('input').forEach(el => {
          el.addEventListener('input', () => this.calculate());
          el.addEventListener('change', () => this.calculate());
        });

        this.calculate();
      }

      calculate() {
        const itemKey = this.selectEl.value;
        const categoryData = recipeData[this.categoryKey] || {};
        const item = categoryData[itemKey];
        let totalLabor = 0;
        const totalMaterials = {};

        if (!item) {
          this.totalsEl.innerHTML = '';
          return;
        }

        const baseQtyInput = this.partsEl.querySelector('.base-qty-input');
        if (baseQtyInput) {
          const baseQty = Math.max(1, parseInt(baseQtyInput.value) || 1);
          totalLabor += (item.labor || 0) * baseQty;
          for (const [mat, qty] of Object.entries(item.materials || {})) {
            totalMaterials[mat] = (totalMaterials[mat] || 0) + qty * baseQty;
          }
        }

        (item.attachmentIds || []).forEach(attId => {
          const cb = this.partsEl.querySelector(`.att-checkbox[data-att-id="${attId}"]`);
          if (cb && cb.checked) {
            const qtyInput = this.partsEl.querySelector(`.att-qty-input[data-att-id="${attId}"]`);
            const attQty = Math.max(1, parseInt(qtyInput ? qtyInput.value : 1) || 1);
            const att = recipeData.attachments[attId];

            if (att) {
              totalLabor += (att.labor || 0) * attQty;
              for (const [mat, qty] of Object.entries(att.materials || {})) {
                totalMaterials[mat] = (totalMaterials[mat] || 0) + qty * attQty;
              }
            }
          }
        });

        this.totalsEl.innerHTML = `<li><span class="labor-tag">労働力</span>: <strong>${totalLabor} pt</strong></li>`;
        for (const [mat, qty] of Object.entries(totalMaterials)) {
          this.totalsEl.innerHTML += `<li>${mat}: <strong>${qty} 個</strong></li>`;
        }
      }
    }

    const weaponCalc = new CraftCalculator('weapon', 'weapon', document.getElementById('weapon-select'), document.getElementById('weapon-parts'), document.getElementById('weapon-totals'));
    const crimeCalc = new CraftCalculator('crime', 'crime', document.getElementById('crime-select'), document.getElementById('crime-parts'), document.getElementById('crime-totals'));

    const modal = document.getElementById('edit-modal');
    const modeSelect = document.getElementById('edit-mode-select');
    const modeItemCont = document.getElementById('mode-item-container');
    const modeAttachCont = document.getElementById('mode-attach-container');

    const editCatSelect = document.getElementById('edit-category-select');
    const editItemSelect = document.getElementById('edit-item-select');
    const editItemName = document.getElementById('edit-item-name');
    const editItemLabor = document.getElementById('edit-item-labor');
    const itemMatsContainer = document.getElementById('item-mats-container');
    const attachCheckboxList = document.getElementById('attach-checkbox-list');

    const editAttachSelect = document.getElementById('edit-attach-select');
    const editAttachName = document.getElementById('edit-attach-name');
    const editAttachLabor = document.getElementById('edit-attach-labor');
    const attachMatsContainer = document.getElementById('attach-mats-container');

    modeSelect.addEventListener('change', () => {
      if (modeSelect.value === 'item') {
        modeItemCont.style.display = 'block';
        modeAttachCont.style.display = 'none';
        updateItemSelectOptions();
      } else {
        modeItemCont.style.display = 'none';
        modeAttachCont.style.display = 'block';
        updateAttachSelectOptions();
      }
    });

    function updateItemSelectOptions() {
      editItemSelect.innerHTML = '<option value="__new__">【＋ 新規アイテムを追加】</option>';
      const cat = editCatSelect.value;
      for (const [key, item] of Object.entries(recipeData[cat] || {})) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = item.name;
        editItemSelect.appendChild(opt);
      }
      renderItemForm();
    }

    function renderItemForm() {
      const cat = editCatSelect.value;
      const key = editItemSelect.value;
      itemMatsContainer.innerHTML = '';
      attachCheckboxList.innerHTML = '';

      let item = { name: '', labor: 0, materials: {}, attachmentIds: [] };
      if (key !== '__new__' && recipeData[cat] && recipeData[cat][key]) {
        item = recipeData[cat][key];
      }

      editItemName.value = item.name || '';
      editItemLabor.value = item.labor || 0;

      for (const [mat, qty] of Object.entries(item.materials || {})) {
        addMatRow(itemMatsContainer, mat, qty);
      }

      for (const [attId, att] of Object.entries(recipeData.attachments || {})) {
        const isChecked = (item.attachmentIds || []).includes(attId) ? 'checked' : '';
        const label = document.createElement('label');
        label.className = 'checkbox-label';
        label.style.fontSize = '13px';
        label.innerHTML = `<input type="checkbox" class="edit-item-att-cb" value="${attId}" ${isChecked}> ${att.name}`;
        attachCheckboxList.appendChild(label);
      }
    }

    function updateAttachSelectOptions() {
      editAttachSelect.innerHTML = '<option value="__new__">【＋ 新規アタッチメントを追加】</option>';
      for (const [key, att] of Object.entries(recipeData.attachments || {})) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = att.name;
        editAttachSelect.appendChild(opt);
      }
      renderAttachForm();
    }

    function renderAttachForm() {
      const key = editAttachSelect.value;
      attachMatsContainer.innerHTML = '';

      let att = { name: '', labor: 0, materials: {} };
      if (key !== '__new__' && recipeData.attachments && recipeData.attachments[key]) {
        att = recipeData.attachments[key];
      }

      editAttachName.value = att.name || '';
      editAttachLabor.value = att.labor || 0;

      for (const [mat, qty] of Object.entries(att.materials || {})) {
        addMatRow(attachMatsContainer, mat, qty);
      }
    }

    function addMatRow(container, name = '', qty = 1) {
      const row = document.createElement('div');
      row.className = 'mat-input-row';
      row.innerHTML = `
        <input type="text" class="edit-mat-name" value="${name}" placeholder="素材名">
        <input type="number" class="edit-mat-qty" value="${qty}" min="1" style="width: 80px;">
        <button class="btn btn-red" style="padding: 2px 6px; font-size: 11px;">×</button>
      `;
      row.querySelector('button').addEventListener('click', () => row.remove());
      container.appendChild(row);
    }

    document.getElementById('add-item-mat-btn').addEventListener('click', () => addMatRow(itemMatsContainer));
    document.getElementById('add-attach-mat-btn').addEventListener('click', () => addMatRow(attachMatsContainer));

    editCatSelect.addEventListener('change', updateItemSelectOptions);
    editItemSelect.addEventListener('change', renderItemForm);
    editAttachSelect.addEventListener('change', renderAttachForm);

    document.getElementById('edit-recipe-btn').addEventListener('click', () => {
      modeSelect.value = 'item';
      modeItemCont.style.display = 'block';
      modeAttachCont.style.display = 'none';
      updateItemSelectOptions();
      modal.classList.add('active');
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.remove('active'));

    document.getElementById('save-modal-btn').addEventListener('click', () => {
      if (modeSelect.value === 'item') {
        const cat = editCatSelect.value;
        let key = editItemSelect.value;
        const name = editItemName.value.trim();
        if (!name) return alert('アイテム名を入力してください。');

        if (key === '__new__') key = `item_${Date.now()}`;

        const materials = {};
        itemMatsContainer.querySelectorAll('.mat-input-row').forEach(row => {
          const mName = row.querySelector('.edit-mat-name').value.trim();
          const mQty = parseInt(row.querySelector('.edit-mat-qty').value) || 0;
          if (mName && mQty > 0) materials[mName] = mQty;
        });

        const attachmentIds = [];
        attachCheckboxList.querySelectorAll('.edit-item-att-cb:checked').forEach(cb => {
          attachmentIds.push(cb.value);
        });

        if (!recipeData[cat]) recipeData[cat] = {};
        recipeData[cat][key] = {
          name: name,
          labor: parseInt(editItemLabor.value) || 0,
          materials: materials,
          attachmentIds: attachmentIds
        };

      } else {
        let key = editAttachSelect.value;
        const name = editAttachName.value.trim();
        if (!name) return alert('アタッチメント名を入力してください。');

        if (key === '__new__') key = `att_${Date.now()}`;

        const materials = {};
        attachMatsContainer.querySelectorAll('.mat-input-row').forEach(row => {
          const mName = row.querySelector('.edit-mat-name').value.trim();
          const mQty = parseInt(row.querySelector('.edit-mat-qty').value) || 0;
          if (mName && mQty > 0) materials[mName] = mQty;
        });

        if (!recipeData.attachments) recipeData.attachments = {};
        recipeData.attachments[key] = {
          name: name,
          labor: parseInt(editAttachLabor.value) || 0,
          materials: materials
        };
      }

      localStorage.setItem('craft_recipes_data_v2', JSON.stringify(recipeData));

      weaponCalc.updateSelectOptions(true);
      crimeCalc.updateSelectOptions(true);
      weaponCalc.render();
      crimeCalc.render();

      modal.classList.remove('active');
      alert('保存が完了しました！');
    });

    document.getElementById('export-btn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(recipeData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fivem_craft_recipes_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    const fileInput = document.getElementById('import-file');
    document.getElementById('import-btn').addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.weapon && imported.crime && imported.attachments) {
            recipeData = imported;
            localStorage.setItem('craft_recipes_data_v2', JSON.stringify(recipeData));
            weaponCalc.updateSelectOptions(false);
            crimeCalc.updateSelectOptions(false);
            weaponCalc.render();
            crimeCalc.render();
            alert('データの読み込みが完了しました！');
          } else { alert('形式が正しくありません。'); }
        } catch (err) { alert('読み込みに失敗しました。'); }
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
