<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>FiveM クラフト計算機</title>
  <style>
    body { font-family: sans-serif; background-color: #1a202c; color: #e2e8f0; padding: 20px; }
    .card { background-color: #2d3748; padding: 20px; border-radius: 8px; max-width: 500px; margin-bottom: 20px; }
    h2 { color: #f6ad55; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    select, input[type="number"] { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #4a5568; background: #1a202c; color: #fff; box-sizing: border-box; }
    .option-group { background: #1a202c; padding: 12px; border-radius: 6px; margin-bottom: 10px; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: bold; color: #ed8936; }
    .checkbox-label input { width: auto; cursor: pointer; }
    .material-list { margin-top: 8px; padding-left: 20px; font-size: 14px; color: #cbd5e0; }
    .labor-tag { color: #63b3ed; font-weight: bold; }
    .total-box { background: #1a202c; padding: 15px; border-radius: 6px; border-left: 4px solid #f6ad55; margin-top: 20px; }
    .total-box h3 { margin-top: 0; font-size: 16px; color: #f6ad55; }
    .total-box ul { padding-left: 20px; margin-bottom: 0; }
  </style>
</head>
<body>

<div class="card">
  <h2>[9023]武器クラフト【武器・防具】</h2>

  <div class="form-group">
    <label for="item-select">作成する武器・防具</label>
    <select id="item-select">
      <option value="heavy_pistol">ヘビーピストル</option>
      <option value="armor">防弾チョッキ</option>
    </select>
  </div>

  <div class="form-group">
    <label for="item-count">作成する個数</label>
    <input type="number" id="item-count" value="1" min="1" />
  </div>

  <!-- 動的に生成されるパーツ・オプションエリア -->
  <div id="craft-options"></div>

  <!-- 合計結果エリア -->
  <div class="total-box">
    <h3>📦 必要な全素材・労働力の合計</h3>
    <ul id="total-materials"></ul>
  </div>
</div>

<script>
  // レシピデータ定義（労働力: labor を追加）
  const recipes = {
    heavy_pistol: {
      name: "ヘビーピストル",
      base: {
        title: "🔹 本体",
        labor: 10, // 労働力 (1個あたり)
        materials: { "高品質な鉄": 10, "スプリング": 3 }
      },
      options: [
        {
          id: "suppressor",
          title: "🔹 サプレッサー",
          labor: 5,
          materials: { "高品質な鉄": 4 }
        },
        {
          id: "ammo_9mm",
          title: "🔹 9mm弾",
          labor: 2,
          materials: { "ガンパウダー": 2 }
        }
      ]
    },
    armor: {
      name: "防弾チョッキ",
      base: {
        title: "🔹 本体",
        labor: 15,
        materials: { "プラスチック": 8, "布": 12 }
      },
      options: []
    }
  };

  const itemSelect = document.getElementById('item-select');
  const itemCountInput = document.getElementById('item-count');
  const craftOptionsDiv = document.getElementById('craft-options');
  const totalMaterialsUl = document.getElementById('total-materials');

  function renderUI() {
    const selectedKey = itemSelect.value;
    const recipe = recipes[selectedKey];
    craftOptionsDiv.innerHTML = '';

    // 本体パーツ表示
    const baseGroup = document.createElement('div');
    baseGroup.className = 'option-group';
    let baseMatHTML = `<ul><li><span class="labor-tag">労働力</span>: ${recipe.base.labor}pt</li>`;
    for (const [mat, qty] of Object.entries(recipe.base.materials)) {
      baseMatHTML += `<li>${mat}: ${qty}個</li>`;
    }
    baseMatHTML += '</ul>';
    baseGroup.innerHTML = `<strong>${recipe.base.title}</strong><div class="material-list">${baseMatHTML}</div>`;
    craftOptionsDiv.appendChild(baseGroup);

    // 選択式オプション（アタッチメント・弾薬等）表示
    recipe.options.forEach(opt => {
      const optGroup = document.createElement('div');
      optGroup.className = 'option-group';
      
      let optMatHTML = `<ul><li><span class="labor-tag">労働力</span>: ${opt.labor}pt</li>`;
      for (const [mat, qty] of Object.entries(opt.materials)) {
        optMatHTML += `<li>${mat}: ${qty}個</li>`;
      }
      optMatHTML += '</ul>';

      optGroup.innerHTML = `
        <label class="checkbox-label">
          <input type="checkbox" class="option-checkbox" data-opt-id="${opt.id}" checked />
          ${opt.title}を作成する
        </label>
        <div class="material-list">${optMatHTML}</div>
      `;
      craftOptionsDiv.appendChild(optGroup);
    });

    // イベント再バインド＆計算実行
    document.querySelectorAll('.option-checkbox').forEach(cb => {
      cb.addEventListener('change', calculateTotals);
    });
    calculateTotals();
  }

  function calculateTotals() {
    const selectedKey = itemSelect.value;
    const count = parseInt(itemCountInput.value) || 1;
    const recipe = recipes[selectedKey];

    let totalLabor = recipe.base.labor * count;
    const totals = {};

    // 本体の素材計算
    for (const [mat, qty] of Object.entries(recipe.base.materials)) {
      totals[mat] = (totals[mat] || 0) + qty * count;
    }

    // チェックされたオプションの計算
    document.querySelectorAll('.option-checkbox:checked').forEach(cb => {
      const optId = cb.getAttribute('data-opt-id');
      const opt = recipe.options.find(o => o.id === optId);
      if (opt) {
        totalLabor += opt.labor * count;
        for (const [mat, qty] of Object.entries(opt.materials)) {
          totals[mat] = (totals[mat] || 0) + qty * count;
        }
      }
    });

    // 合計表示の更新
    totalMaterialsUl.innerHTML = `<li><span class="labor-tag">労働力</span>: <strong>${totalLabor} pt</strong></li>`;
    for (const [mat, qty] of Object.entries(totals)) {
      totalMaterialsUl.innerHTML += `<li>${mat}: <strong>${qty} 個</strong></li>`;
    }
  }

  itemSelect.addEventListener('change', renderUI);
  itemCountInput.addEventListener('input', calculateTotals);

  // 初回描画
  renderUI();
</script>

</body>
</html>
