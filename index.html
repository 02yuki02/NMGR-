<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FiveM クラフト計算機</title>
  <style>
    :root {
      --bg-color: #1a1c23;
      --card-bg: #232631;
      --sub-card-bg: #2a2d3d;
      --text-color: #e2e8f0;
      --accent-orange: #ed8936;
      --accent-blue: #63b3ed;
      --border-color: #3f4457;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .toolbar {
      background-color: var(--card-bg);
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
    }

    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
    }
    .btn-green { background-color: #38a169; }
    .btn-green:hover { background-color: #2f855a; }
    .btn-gray { background-color: #4a5568; }
    .btn-gray:hover { background-color: #374151; }
    .btn-blue { background-color: #3182ce; }
    .btn-blue:hover { background-color: #2b6cb0; }
    .btn-red { background-color: #e53e3e; }

    .calculator-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      border: 1px solid var(--border-color);
    }

    .card h2 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--accent-orange);
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: #fff;
      box-sizing: border-box;
      font-size: 14px;
    }

    .parts-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .part-box {
      background-color: var(--sub-card-bg);
      padding: 12px;
      border-radius: 6px;
    }

    .part-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: bold;
      color: var(--accent-orange);
    }
    .checkbox-label input { width: auto; cursor: pointer; }

    .qty-input-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .qty-input-wrapper input {
      width: 60px;
      padding: 4px 6px;
      text-align: center;
    }

    .mat-list {
      margin: 8px 0 0 0;
      padding-left: 20px;
      font-size: 13px;
      color: #cbd5e0;
    }

    .labor-tag {
      color: var(--accent-blue);
      font-weight: bold;
    }

    .total-box {
      background-color: var(--bg-color);
      padding: 14px;
      border-radius: 6px;
      border-left: 4px solid var(--accent-orange);
    }

    .total-box h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: var(--accent-orange);
    }

    .total-box ul {
      margin: 0;
      padding-left: 20px;
      font-size: 14px;
    }

    /* 簡易編集モーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      border: 1px solid var(--border-color);
    }

    .edit-part-card {
      background: var(--sub-card-bg);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .mat-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- ツールバー -->
  <div class="toolbar">
    <button id="edit-recipe-btn" class="btn btn-green">📝 レシピを編集・追加する</button>
    <button id="export-btn" class="btn btn-gray">💾 データを書き出す</button>
    <input type="file" id="import-file" accept=".json" style="display: none;" />
    <button id="import-btn" class="btn btn-gray">📂 データを読み込む</button>
  </div>

  <!-- メイン領域 -->
  <div class="calculator-grid">

    <!-- 1. 武器クラフト -->
    <div class="card">
      <h2>[9023]武器クラフト【武器・防具】</h2>
      
      <div class="form-group">
        <label for="weapon-select">作成する武器・防具</label>
        <select id="weapon-select"></select>
      </div>

      <div class="parts-container" id="weapon-parts"></div>

      <div class="total-box">
        <h3>📦 必要な全素材の合計数</h3>
        <ul id="weapon-totals"></ul>
      </div>
    </div>

    <!-- 2. 手芸クラフト -->
    <div class="card">
      <h2>[3057]手芸クラフト【犯罪道具】</h2>

      <div class="form-group">
        <label for="crime-select">ターゲットの犯罪</label>
        <select id="crime-select"></select>
      </div>

      <div class="parts-container" id="crime-parts"></div>

      <div class="total-box">
        <h3>📦 必要な全素材の合計数</h3>
        <ul id="crime-totals"></ul>
      </div>
    </div>

  </div>

  <!-- 簡易レシピ編集モーダル -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-content">
      <h2>📝 選択中レシピの簡易編集</h2>
      
      <div class="form-group">
        <label>編集するカテゴリ</label>
        <select id="edit-category-select">
          <option value="weapon">武器クラフト</option>
          <option value="crime">手芸クラフト</option>
        </select>
      </div>

      <div class="form-group">
        <label>編集するアイテム</label>
        <select id="edit-item-select"></select>
      </div>

      <hr style="border-color: var(--border-color); margin: 15px 0;">

      <div id="edit-parts-list"></div>

      <button id="add-part-btn" class="btn btn-gray" style="width: 100%; justify-content: center; margin-bottom: 15px;">＋ パーツ/アタッチメントを追加</button>

      <div class="modal-actions">
        <button id="close-modal-btn" class="btn btn-gray">キャンセル</button>
        <button id="save-modal-btn" class="btn btn-blue">保存して反映</button>
      </div>
    </div>
  </div>

  <script>
    let recipeData = {
      weapon: {
        heavy_pistol: {
          name: "ヘビーピストル",
          parts: [
            { id: "base", name: "🔹 本体", labor: 10, required: true, defaultQty: 1, materials: { "高品質な鉄": 10, "スプリング": 3 } },
            { id: "suppressor", name: "🔹 サプレッサー", labor: 5, required: false, defaultOn: true, defaultQty: 1, materials: { "高品質な鉄": 4 } },
            { id: "ammo_9mm", name: "🔹 9mm弾", labor: 2, required: false, defaultOn: true, defaultQty: 1, materials: { "ガンパウダー": 2 } }
          ]
        },
        armor: {
          name: "防弾チョッキ",
          parts: [
            { id: "base", name: "🔹 本体", labor: 15, required: true, defaultQty: 1, materials: { "プラスチック": 8, "布": 12 } }
          ]
        }
      },
      crime: {
        pacific: {
          name: "パシフィック銀行強盗",
          parts: [
            { id: "hacking_pc", name: "🔹 ハッキングPC", labor: 20, required: false, defaultOn: true, defaultQty: 1, materials: { "精密部品": 10, "電子部品": 15 } },
            { id: "thermite", name: "🔹 サーマイト爆薬", labor: 10, required: false, defaultOn: true, defaultQty: 1, materials: { "マグネシウム": 5 } }
          ]
        }
      }
    };

    const saved = localStorage.getItem('craft_recipes_data');
    if (saved) {
      try { recipeData = JSON.parse(saved); } catch(e) {}
    }

    class CraftCalculator {
      constructor(type, categoryData, selectEl, partsEl, totalsEl) {
        this.type = type;
        this.categoryData = categoryData;
        this.selectEl = selectEl;
        this.partsEl = partsEl;
        this.totalsEl = totalsEl;

        this.updateSelectOptions();
        this.selectEl.addEventListener('change', () => this.render());
        this.render();
      }

      updateSelectOptions() {
        this.selectEl.innerHTML = '';
        for (const [key, item] of Object.entries(this.categoryData)) {
          const opt = document.createElement('option');
          opt.value = key;
          opt.textContent = item.name;
          this.selectEl.appendChild(opt);
        }
      }

      render() {
        const itemKey = this.selectEl.value;
        const recipe = this.categoryData[itemKey];
        this.partsEl.innerHTML = '';

        if (!recipe) return;

        recipe.parts.forEach(part => {
          const box = document.createElement('div');
          box.className = 'part-box';

          let matListHTML = `<ul class="mat-list"><li><span class="labor-tag">労働力</span>: ${part.labor} pt</li>`;
          for (const [mat, qty] of Object.entries(part.materials)) {
            matListHTML += `<li>${mat}: ${qty} 個</li>`;
          }
          matListHTML += '</ul>';

          const initQty = part.defaultQty || 1;

          if (part.required) {
            box.innerHTML = `
              <div class="part-header">
                <strong>${part.name}</strong>
                <div class="qty-input-wrapper">
                  <span>数量:</span>
                  <input type="number" class="part-qty-input" data-part-id="${part.id}" value="${initQty}" min="1">
                </div>
              </div>
              ${matListHTML}
            `;
          } else {
            const checked = part.defaultOn ? 'checked' : '';
            box.innerHTML = `
              <div class="part-header">
                <label class="checkbox-label">
                  <input type="checkbox" class="part-checkbox" data-part-id="${part.id}" ${checked}>
                  ${part.name}
                </label>
                <div class="qty-input-wrapper">
                  <span>数量:</span>
                  <input type="number" class="part-qty-input" data-part-id="${part.id}" value="${initQty}" min="1">
                </div>
              </div>
              ${matListHTML}
            `;
          }
          this.partsEl.appendChild(box);
        });

        this.partsEl.querySelectorAll('.part-checkbox, .part-qty-input').forEach(el => {
          el.addEventListener('input', () => this.calculate());
          el.addEventListener('change', () => this.calculate());
        });

        this.calculate();
      }

      calculate() {
        const itemKey = this.selectEl.value;
        const recipe = this.categoryData[itemKey];
        let totalLabor = 0;
        const totalMaterials = {};

        if (!recipe) return;

        recipe.parts.forEach(part => {
          let isIncluded = part.required;
          if (!part.required) {
            const cb = this.partsEl.querySelector(`.part-checkbox[data-part-id="${part.id}"]`);
            if (cb && cb.checked) isIncluded = true;
          }

          if (isIncluded) {
            const qtyInput = this.partsEl.querySelector(`.part-qty-input[data-part-id="${part.id}"]`);
            const partQty = Math.max(1, parseInt(qtyInput ? qtyInput.value : 1) || 1);

            totalLabor += part.labor * partQty;
            for (const [mat, qty] of Object.entries(part.materials)) {
              totalMaterials[mat] = (totalMaterials[mat] || 0) + qty * partQty;
            }
          }
        });

        this.totalsEl.innerHTML = `<li><span class="labor-tag">労働力</span>: <strong>${totalLabor} pt</strong></li>`;
        for (const [mat, qty] of Object.entries(totalMaterials)) {
          this.totalsEl.innerHTML += `<li>${mat}: <strong>${qty} 個</strong></li>`;
        }
      }
    }

    const weaponCalc = new CraftCalculator('weapon', recipeData.weapon, 
      document.getElementById('weapon-select'), 
      document.getElementById('weapon-parts'), 
      document.getElementById('weapon-totals')
    );

    const crimeCalc = new CraftCalculator('crime', recipeData.crime, 
      document.getElementById('crime-select'), 
      document.getElementById('crime-parts'), 
      document.getElementById('crime-totals')
    );

    // --- 簡易レシピ編集モーダルの処理 ---
    const modal = document.getElementById('edit-modal');
    const editCatSelect = document.getElementById('edit-category-select');
    const editItemSelect = document.getElementById('edit-item-select');
    const editPartsList = document.getElementById('edit-parts-list');

    function updateEditItemOptions() {
      editItemSelect.innerHTML = '';
      const cat = editCatSelect.value;
      for (const [key, item] of Object.entries(recipeData[cat])) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = item.name;
        editItemSelect.appendChild(opt);
      }
      renderEditForm();
    }

    function renderEditForm() {
      editPartsList.innerHTML = '';
      const cat = editCatSelect.value;
      const itemKey = editItemSelect.value;
      if (!itemKey || !recipeData[cat][itemKey]) return;

      const recipe = recipeData[cat][itemKey];

      recipe.parts.forEach((part, index) => {
        const div = document.createElement('div');
        div.className = 'edit-part-card';

        let matsHTML = '';
        for (const [mat, qty] of Object.entries(part.materials)) {
          matsHTML += `
            <div class="mat-input-row">
              <input type="text" class="edit-mat-name" value="${mat}" placeholder="素材名">
              <input type="number" class="edit-mat-qty" value="${qty}" min="1" placeholder="個数" style="width: 80px;">
            </div>
          `;
        }

        div.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <input type="text" class="edit-part-name" value="${part.name}" placeholder="パーツ名" style="font-weight: bold; width: 60%;">
            <button class="btn btn-red delete-part-btn" style="padding: 2px 8px; font-size: 12px;">削除</button>
          </div>
          <div style="margin-bottom: 8px;">
            <label style="font-size: 12px;">労働力 (pt):</label>
            <input type="number" class="edit-part-labor" value="${part.labor}" min="0">
          </div>
          <label style="font-size: 12px;">必要素材:</label>
          <div class="mat-list-container">${matsHTML}</div>
          <button class="btn btn-gray add-mat-btn" style="font-size: 11px; padding: 2px 6px; margin-top: 4px;">＋ 素材枠追加</button>
        `;

        editPartsList.appendChild(div);
      });

      // イベントバインド (素材追加・パーツ削除)
      editPartsList.querySelectorAll('.add-mat-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const container = e.target.previousElementSibling;
          const row = document.createElement('div');
          row.className = 'mat-input-row';
          row.innerHTML = `
            <input type="text" class="edit-mat-name" placeholder="素材名">
            <input type="number" class="edit-mat-qty" value="1" min="1" placeholder="個数" style="width: 80px;">
          `;
          container.appendChild(row);
        });
      });

      editPartsList.querySelectorAll('.delete-part-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.target.closest('.edit-part-card').remove();
        });
      });
    }

    editCatSelect.addEventListener('change', updateEditItemOptions);
    editItemSelect.addEventListener('change', renderEditForm);

    document.getElementById('add-part-btn').addEventListener('click', () => {
      const div = document.createElement('div');
      div.className = 'edit-part-card';
      div.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <input type="text" class="edit-part-name" value="🔹 新規パーツ" style="font-weight: bold; width: 60%;">
          <button class="btn btn-red delete-part-btn" style="padding: 2px 8px; font-size: 12px;">削除</button>
        </div>
        <div style="margin-bottom: 8px;">
          <label style="font-size: 12px;">労働力 (pt):</label>
          <input type="number" class="edit-part-labor" value="0" min="0">
        </div>
        <label style="font-size: 12px;">必要素材:</label>
        <div class="mat-list-container">
          <div class="mat-input-row">
            <input type="text" class="edit-mat-name" placeholder="素材名">
            <input type="number" class="edit-mat-qty" value="1" min="1" style="width: 80px;">
          </div>
        </div>
        <button class="btn btn-gray add-mat-btn" style="font-size: 11px; padding: 2px 6px; margin-top: 4px;">＋ 素材枠追加</button>
      `;
      editPartsList.appendChild(div);

      div.querySelector('.add-mat-btn').addEventListener('click', (e) => {
        const container = e.target.previousElementSibling;
        const row = document.createElement('div');
        row.className = 'mat-input-row';
        row.innerHTML = `
          <input type="text" class="edit-mat-name" placeholder="素材名">
          <input type="number" class="edit-mat-qty" value="1" min="1" style="width: 80px;">
        `;
        container.appendChild(row);
      });

      div.querySelector('.delete-part-btn').addEventListener('click', () => div.remove());
    });

    document.getElementById('edit-recipe-btn').addEventListener('click', () => {
      updateEditItemOptions();
      modal.classList.add('active');
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => {
      modal.classList.remove('active');
    });

    document.getElementById('save-modal-btn').addEventListener('click', () => {
      const cat = editCatSelect.value;
      const itemKey = editItemSelect.value;

      const newParts = [];
      const partCards = editPartsList.querySelectorAll('.edit-part-card');

      partCards.forEach((card, idx) => {
        const name = card.querySelector('.edit-part-name').value;
        const labor = parseInt(card.querySelector('.edit-part-labor').value) || 0;
        const materials = {};

        const matRows = card.querySelectorAll('.mat-input-row');
        matRows.forEach(row => {
          const matName = row.querySelector('.edit-mat-name').value.trim();
          const matQty = parseInt(row.querySelector('.edit-mat-qty').value) || 0;
          if (matName && matQty > 0) {
            materials[matName] = matQty;
          }
        });

        newParts.push({
          id: `part_${idx}_${Date.now()}`,
          name: name,
          labor: labor,
          required: idx === 0, // 最初のパーツのみ本体として必須扱い
          defaultOn: true,
          defaultQty: 1,
          materials: materials
        });
      });

      recipeData[cat][itemKey].parts = newParts;
      localStorage.setItem('craft_recipes_data', JSON.stringify(recipeData));

      weaponCalc.render();
      crimeCalc.render();
      modal.classList.remove('active');
      alert('レシピを更新しました！');
    });

    // --- エクスポート / インポート ---
    document.getElementById('export-btn').addEventListener('click', () => {
      const dataStr = JSON.stringify(recipeData, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fivem_craft_recipes_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    const fileInput = document.getElementById('import-file');
    document.getElementById('import-btn').addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.weapon && imported.crime) {
            recipeData = imported;
            localStorage.setItem('craft_recipes_data', JSON.stringify(recipeData));
            weaponCalc.categoryData = recipeData.weapon;
            crimeCalc.categoryData = recipeData.crime;
            weaponCalc.updateSelectOptions();
            crimeCalc.updateSelectOptions();
            weaponCalc.render();
            crimeCalc.render();
            alert('データの読み込みが完了しました！');
          } else {
            alert('形式が正しくありません。');
          }
        } catch (err) {
          alert('JSONファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
